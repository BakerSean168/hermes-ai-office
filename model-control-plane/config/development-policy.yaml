version: 2

concurrency:
  max_active_writers: 4
  max_active_writers_per_project: 2

phases:
  ORCHESTRATE:
    backend_candidates:
      - openhands-builtin
      - codex-business-planner-headless
    model_class: planning-premium
    transport_preference:
      - LITELLM_MANAGED
      - PROVIDER_NATIVE
    workspace_mode: read_oriented
    session_policy: fresh

  INVESTIGATE_PLAN:
    backend_candidates:
      - openhands-builtin
      - codex-business-planner-headless
      - codex-acp
      - claude-code-acp
      - opencode-acp
    model_class: planning-premium
    transport_preference:
      - LITELLM_MANAGED
      - PROVIDER_NATIVE
    workspace_mode: read_oriented
    session_policy: fresh

  ADOPT_CHANGE:
    backend_candidates:
      - control-plane-change-adopter
    model_class: deterministic-adopt-v1
    transport_preference:
      - INTERNAL
    workspace_mode: isolated_write
    session_policy: fresh

  IMPLEMENT:
    backend_candidates:
      - dsh-acp
      - opencode-acp
      - openhands-builtin
      - zcode-acp
      - claude-code-acp
      - codex-acp
    model_class: implementation-efficient
    transport_preference:
      - LITELLM_MANAGED
      - PROVIDER_NATIVE
    workspace_mode: isolated_write
    session_policy: fresh

  IMPLEMENT_FIX:
    backend_candidates:
      - dsh-acp
      - opencode-acp
      - openhands-builtin
      - zcode-acp
      - claude-code-acp
      - codex-acp
    model_class: implementation-efficient
    transport_preference:
      - LITELLM_MANAGED
      - PROVIDER_NATIVE
    workspace_mode: reuse_implementation_workspace
    session_policy: resume_preferred

  VERIFY_REVIEW:
    backend_candidates:
      - codex-business-review-headless
      - codex-review-headless
      - claude-code-review-headless
      - openhands-builtin
    model_class: review-premium
    model_fallbacks:
      - codex-auto-review
      - gpt-5.4
    transport_preference:
      - LITELLM_MANAGED
      - PROVIDER_NATIVE
    workspace_mode: review_snapshot
    session_policy: fresh_required

  BATCH_VERIFY:
    backend_candidates:
      - codex-business-review-headless
      - codex-review-headless
      - claude-code-review-headless
      - openhands-builtin
    model_class: review-premium
    model_fallbacks:
      - codex-auto-review
      - gpt-5.4
    transport_preference:
      - PROVIDER_NATIVE
      - LITELLM_MANAGED
    workspace_mode: read_oriented
    session_policy: fresh_required

  FINALIZE:
    backend_candidates:
      - control-plane-finalizer
    model_class: deterministic-finalize-v1
    transport_preference:
      - INTERNAL
    workspace_mode: none
    session_policy: fresh

backends:
  antigravity-review:
    kind: external_adapter
    enabled: true
    default_model: gemini-3.1-pro-high
    supports:
      litellm_managed: false
      provider_native: true
      write: false
      untrusted_external: false

  antigravity-worker:
    kind: external_adapter
    enabled: true
    default_model: gemini-3.7-flash-high
    supports:
      litellm_managed: false
      provider_native: true
      write: true
      untrusted_external: false

  control-plane-change-adopter:
    kind: internal
    enabled: true
    supports:
      write: false

  openhands-builtin:
    kind: openhands
    enabled: true
    supports:
      litellm_managed: true
      write: true

  opencode-acp:
    kind: acp
    enabled: true
    command:
      - /opt/hermes-ai-office-tools/harness_agent_launcher.sh
      - opencode
      - acp
    acp_server: custom
    managed_model_prefix: litellm-v3/
    managed_env:
      LITELLM_V3_KEY: litellm_api_key
      LITELLM_V3_OPENAI_BASE_URL: litellm_base_url_v1
      HERMES_V3_EXECUTION_ID: execution_id
    supports:
      litellm_managed: true
      write: true

  # Business Team planning is opt-in. Default orchestration remains on the managed
  # supervisor so an exhausted Business workspace cannot block durable plan creation.
  # When explicitly selected, planning uses Sol at medium reasoning effort.
  codex-business-planner-headless:
    kind: acp
    enabled: true
    command:
      - /usr/local/bin/node
      - /opt/hermes-ai-office-tools/headless_review_acp.mjs
    acp_server: custom
    default_model: gpt-5.6-sol
    static_env:
      AI_OFFICE_HEADLESS_DRIVER: codex
      AI_OFFICE_HEADLESS_ROLE: planner
      AI_OFFICE_HEADLESS_TRANSPORT: provider-native
      AI_OFFICE_HEADLESS_MODEL: gpt-5.6-sol
      AI_OFFICE_HEADLESS_REASONING_EFFORT: medium
      AI_OFFICE_CODEX_AUTH_HOME: /openhands-state/codex-business
      AI_OFFICE_CODEX_BIN: /openhands-state/tooling/node_modules/.bin/codex
      AI_OFFICE_WORKSPACE_ROOT: /workspace
      AI_OFFICE_HEADLESS_TIMEOUT_SECONDS: '1200'
    supports:
      litellm_managed: false
      provider_native: true
      write: false
      untrusted_external: false

  # Business Team implementation is deliberately opt-in rather than part of the
  # automatic managed-worker ladder. When explicitly selected, use Luna at the
  # highest reasoning effort; ordinary implementation stays on the economical
  # LiteLLM-managed DeepSeek -> GLM path.
  codex-business-worker-headless:
    kind: acp
    enabled: true
    command:
      - /usr/local/bin/node
      - /opt/hermes-ai-office-tools/headless_review_acp.mjs
    acp_server: custom
    default_model: gpt-5.6-luna
    static_env:
      AI_OFFICE_HEADLESS_DRIVER: codex
      AI_OFFICE_HEADLESS_ROLE: worker
      AI_OFFICE_HEADLESS_TRANSPORT: provider-native
      AI_OFFICE_HEADLESS_MODEL: gpt-5.6-luna
      AI_OFFICE_HEADLESS_REASONING_EFFORT: xhigh
      AI_OFFICE_CODEX_AUTH_HOME: /openhands-state/codex-business
      AI_OFFICE_CODEX_BIN: /openhands-state/tooling/node_modules/.bin/codex
      AI_OFFICE_WORKSPACE_ROOT: /workspace
      AI_OFFICE_HEADLESS_TIMEOUT_SECONDS: '1800'
    supports:
      litellm_managed: false
      provider_native: true
      write: true
      untrusted_external: false

  codex-business-review-headless:
    kind: acp
    enabled: true
    command:
      - /usr/local/bin/node
      - /opt/hermes-ai-office-tools/headless_review_acp.mjs
    acp_server: custom
    default_model: gpt-5.6-sol
    static_env:
      AI_OFFICE_HEADLESS_DRIVER: codex
      AI_OFFICE_HEADLESS_TRANSPORT: provider-native
      AI_OFFICE_HEADLESS_MODEL: gpt-5.6-sol
      AI_OFFICE_HEADLESS_REASONING_EFFORT: medium
      AI_OFFICE_CODEX_AUTH_HOME: /openhands-state/codex-business
      AI_OFFICE_CODEX_BIN: /openhands-state/tooling/node_modules/.bin/codex
      AI_OFFICE_WORKSPACE_ROOT: /workspace
      AI_OFFICE_HEADLESS_TIMEOUT_SECONDS: '900'
    supports:
      litellm_managed: false
      provider_native: true
      write: false
      untrusted_external: false

  codex-review-headless:
    kind: acp
    enabled: true
    command:
      - /usr/local/bin/node
      - /opt/hermes-ai-office-tools/headless_review_acp.mjs
    acp_server: custom
    managed_model_prefix: ''
    managed_env:
      AI_OFFICE_HEADLESS_MODEL: logical_model
      AI_OFFICE_LITELLM_BASE_URL: litellm_base_url
      AI_OFFICE_LITELLM_API_KEY: litellm_api_key
      HERMES_V3_EXECUTION_ID: execution_id
    static_env:
      AI_OFFICE_HEADLESS_DRIVER: codex
      AI_OFFICE_CODEX_BIN: /openhands-state/tooling/node_modules/.bin/codex
      AI_OFFICE_WORKSPACE_ROOT: /workspace
      AI_OFFICE_HEADLESS_TIMEOUT_SECONDS: '900'
    supports:
      litellm_managed: true
      write: false

  claude-code-review-headless:
    kind: acp
    enabled: true
    command:
      - /usr/local/bin/node
      - /opt/hermes-ai-office-tools/headless_review_acp.mjs
    acp_server: custom
    managed_model_prefix: ''
    managed_env:
      AI_OFFICE_HEADLESS_MODEL: logical_model
      AI_OFFICE_LITELLM_BASE_URL: litellm_base_url
      AI_OFFICE_LITELLM_API_KEY: litellm_api_key
      HERMES_V3_EXECUTION_ID: execution_id
    static_env:
      AI_OFFICE_HEADLESS_DRIVER: claude
      AI_OFFICE_CLAUDE_BIN: /openhands-state/tooling/node_modules/.bin/claude
      AI_OFFICE_WORKSPACE_ROOT: /workspace
      AI_OFFICE_HEADLESS_TIMEOUT_SECONDS: '900'
    supports:
      litellm_managed: true
      write: false

  codex-acp:
    kind: acp
    enabled: true
    command:
      - /opt/hermes-ai-office-tools/harness_agent_launcher.sh
      - codex-acp
    acp_server: codex
    managed_model_prefix: ''
    # IMPLEMENT remains one capability tier. Codex materializes that tier onto
    # Luna/xhigh; DSH/OpenCode keep the gateway's DeepSeek -> GLM route.
    managed_model_overrides:
      implementation-efficient: gpt-5.6-luna
    managed_reasoning_effort_overrides:
      implementation-efficient: xhigh
    managed_env:
      CODEX_API_KEY: litellm_api_key
      CODEX_CONFIG: codex_config
      HERMES_V3_EXECUTION_ID: execution_id
    static_env:
      MODEL_PROVIDER: hermes-litellm
      NO_BROWSER: '1'
    supports:
      litellm_managed: true
      write: true

  claude-code-acp:
    kind: acp
    enabled: true
    command:
      - /opt/hermes-ai-office-tools/harness_agent_launcher.sh
      - claude-acp
    acp_server: claude-code
    managed_model_prefix: ''
    managed_env:
      ANTHROPIC_API_KEY: litellm_api_key
      ANTHROPIC_BASE_URL: litellm_base_url
      ANTHROPIC_MODEL: logical_model
      ANTHROPIC_CUSTOM_MODEL_OPTION: logical_model
      CLAUDE_CODE_SUBAGENT_MODEL: logical_model
      HERMES_V3_EXECUTION_ID: execution_id
    supports:
      litellm_managed: true
      write: true

  dsh-acp:
    kind: acp
    enabled: true
    command:
      - /opt/hermes-ai-office-tools/harness_agent_launcher.sh
      - dsh-acp
    acp_server: custom
    managed_model_prefix: ''
    managed_env:
      DEEPSEEK_API_KEY: litellm_api_key
      DEEPSEEK_BASE_URL: litellm_base_url_v1
      DSH_ACP_MODEL: logical_model
      HERMES_V3_EXECUTION_ID: execution_id
    static_env:
      DSH_HOME: /openhands-state/dsh
      DSH_BIN: /openhands-state/dsh-cli/node_modules/.bin/dsh
    supports:
      litellm_managed: true
      write: true

  zcode-acp:
    kind: acp
    enabled: true
    command:
      - /openhands-state/tooling/node_modules/.bin/zcode-acp-server
    acp_server: custom
    managed_model_prefix: ''
    managed_env:
      ZCODE_MODEL: logical_model
      ZCODE_BASE_URL: litellm_base_url_v1
      HERMES_V3_EXECUTION_ID: execution_id
    supports:
      litellm_managed: true
      write: true

  control-plane-finalizer:
    kind: internal
    enabled: true
    supports:
      write: false
