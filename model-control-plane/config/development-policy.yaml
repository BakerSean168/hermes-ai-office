version: 2

concurrency:
  max_active_writers: 4
  max_active_writers_per_project: 2

phases:
  INVESTIGATE_PLAN:
    backend_candidates:
      - openhands-builtin
      - opencode-acp
    model_class: planning-premium
    transport_preference:
      - LITELLM_MANAGED
    workspace_mode: read_oriented
    session_policy: fresh

  IMPLEMENT:
    backend_candidates:
      - opencode-acp
      - openhands-builtin
    model_class: implementation-efficient
    transport_preference:
      - LITELLM_MANAGED
    workspace_mode: isolated_write
    session_policy: fresh

  IMPLEMENT_FIX:
    backend_candidates:
      - opencode-acp
      - openhands-builtin
    model_class: implementation-efficient
    transport_preference:
      - LITELLM_MANAGED
    workspace_mode: reuse_implementation_workspace
    session_policy: resume_preferred

  VERIFY_REVIEW:
    backend_candidates:
      - openhands-builtin
      - opencode-acp
    model_class: review-premium
    transport_preference:
      - LITELLM_MANAGED
    workspace_mode: review_snapshot
    session_policy: fresh_required

  FINALIZE:
    backend_candidates:
      - control-plane-finalizer
    model_class: deterministic-finalize-v1
    transport_preference:
      - INTERNAL
    workspace_mode: none
    session_policy: fresh

backends:
  openhands-builtin:
    kind: openhands
    enabled: true
    supports:
      litellm_managed: true
      write: true

  opencode-acp:
    kind: acp
    enabled: true
    command:
      - /openhands-state/tooling/node_modules/.bin/opencode
      - acp
    acp_server: custom
    managed_model_prefix: litellm-v3/
    supports:
      litellm_managed: true
      write: true

  control-plane-finalizer:
    kind: internal
    enabled: true
    supports:
      write: false
