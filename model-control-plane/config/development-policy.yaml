version: 1

concurrency:
  max_active_writers: 4
  max_active_writers_per_project: 2

phases:
  INVESTIGATE_PLAN:
    backend_candidates:
      - codex-acp
      - openhands-builtin
      - opencode-acp
    model_class: planning-premium
    transport_preference:
      - NATIVE_SUBSCRIPTION
      - LITELLM_MANAGED
    workspace_mode: read_oriented
    session_policy: fresh

  IMPLEMENT:
    backend_candidates:
      - opencode-acp
      - openhands-builtin
      - codex-acp
    model_class: implementation-efficient
    transport_preference:
      - LITELLM_MANAGED
      - NATIVE_SUBSCRIPTION
    workspace_mode: isolated_write
    session_policy: fresh

  IMPLEMENT_FIX:
    backend_candidates:
      - opencode-acp
      - codex-acp
      - openhands-builtin
    model_class: implementation-efficient
    transport_preference:
      - LITELLM_MANAGED
      - NATIVE_SUBSCRIPTION
    workspace_mode: reuse_implementation_workspace
    session_policy: resume_preferred

  VERIFY_REVIEW:
    backend_candidates:
      - codex-acp
      - openhands-builtin
      - opencode-acp
    model_class: review-premium
    transport_preference:
      - NATIVE_SUBSCRIPTION
      - LITELLM_MANAGED
    workspace_mode: review_snapshot
    session_policy: fresh_required

  FINALIZE:
    backend_candidates:
      - control-plane-finalizer
    model_class: deterministic-finalize-v1
    transport_preference:
      - INTERNAL
    workspace_mode: none
    session_policy: fresh

backends:
  openhands-builtin:
    kind: openhands
    enabled: true
    supports:
      litellm_managed: true
      native_subscription: false
      write: true

  codex-acp:
    kind: acp
    enabled: true
    command:
      - npx
      - -y
      - '@zed-industries/codex-acp@0.16.0'
    acp_server: codex
    supports:
      litellm_managed: conditional
      native_subscription: true
      write: true

  opencode-acp:
    kind: acp
    enabled: true
    command:
      - /openhands-state/tooling/node_modules/.bin/opencode
      - acp
    acp_server: custom
    managed_model_prefix: litellm-v3/
    supports:
      litellm_managed: true
      native_subscription: true
      write: true

  claude-code-acp:
    kind: acp
    enabled: false
    command:
      - npx
      - -y
      - '@agentclientprotocol/claude-agent-acp@0.70.0'
    acp_server: claude-code
    supports:
      litellm_managed: conditional
      native_subscription: true
      write: true

  dsh:
    kind: external_adapter
    enabled: false
    supports:
      litellm_managed: conditional
      native_subscription: false
      write: true

  control-plane-finalizer:
    kind: internal
    enabled: true
    supports:
      write: false
