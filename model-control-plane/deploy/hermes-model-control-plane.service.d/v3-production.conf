[Service]
# AI Office V3 runtime. LiteLLM is the single provider/model runtime authority.
# Host-specific public URLs belong in the root-owned runtime env file, not Git.
EnvironmentFile=-/srv/hermes-personal/secrets/model-control-plane-v3.env
Environment=MODEL_CP_V3_OPENHANDS_URL=http://127.0.0.1:18000
Environment=MODEL_CP_V3_OPENHANDS_ENV_FILE=/srv/hermes-personal/secrets/openhands-v3.env
Environment=MODEL_CP_V3_LITELLM_URL=http://127.0.0.1:4000
Environment=MODEL_CP_V3_ENABLED_BACKENDS=opencode-acp,dsh-acp,codex-acp,codex-business-planner-headless,codex-business-worker-headless,codex-business-review-headless,codex-review-headless,claude-code-review-headless,openhands-builtin
Environment=MODEL_CP_V3_WORKSPACE_ROOT=/opt/data/hermes-ai-office-v3/workspaces
Environment=MODEL_CP_V3_OPENHANDS_WORKSPACE_ROOT=/workspace
Environment=MODEL_CP_V3_REPOSITORY_ROOTS=/home/ubuntu/projects,/opt/data
Environment=MODEL_CP_V3_LITELLM_ADMIN_ENV_FILE=/srv/hermes-personal/secrets/litellm.env
ReadWritePaths=/opt/data/hermes-ai-office-v3/workspaces
