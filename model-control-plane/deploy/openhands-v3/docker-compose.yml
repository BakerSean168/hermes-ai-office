name: hermes-openhands-v3

services:
  agent-server:
    image: ${OPENHANDS_SOURCE_IMAGE:-hermes-openhands-agent-server:1.39.1-source}
    container_name: hermes-openhands-v3
    network_mode: host
    # Docker does not automatically inherit the host's Tailscale MagicDNS
    # resolver. Use the tailnet resolver explicitly so private service names
    # (for example the Oracle-hosted LiteLLM authority) never fall back to
    # public DNS inside the worker container.
    dns:
      - 100.100.100.100
    command:
      - --host
      - 127.0.0.1
      - --port
      - '18000'
    env_file:
      - ${HERMES_OPENHANDS_ENV_FILE:-/srv/hermes-personal/secrets/openhands-v3.env}
    environment:
      OPENHANDS_SUPPRESS_BANNER: '1'
      LOG_JSON: 'true'
      OH_ENABLE_VNC: '0'
      OH_ENABLE_VSCODE: '0'
      OH_PRELOAD_TOOLS: '0'
      OPENCODE_CONFIG: /etc/hermes-ai-office-v3/opencode.json
      PYTHONPATH: /opt/hermes-ai-office-tools
      AI_OFFICE_CONTROL_PLANE_URL: http://127.0.0.1:8320
    volumes:
      - /opt/data/hermes-ai-office-v3/workspaces:/workspace
      - /opt/data/hermes-ai-office-v3/openhands:/openhands-state
      - ./opencode-v3.json:/etc/hermes-ai-office-v3/opencode.json:ro
      - ./dsh-acp-v3.patch.yml:/etc/hermes-ai-office-v3/dsh-acp-v3.patch.yml:ro
      - ../../openhands_tools:/opt/hermes-ai-office-tools:ro
    cap_drop:
      - ALL
    security_opt:
      # Codex's workspace-write sandbox uses bubblewrap user namespaces. Docker's
      # default seccomp profile blocks the required unshare(2) call. Ubuntu also
      # requires an AppArmor profile that explicitly grants userns. Keep every Linux
      # capability dropped and no-new-privileges enforced; the dedicated AppArmor
      # profile is installed by the GCP execution-plane installer and exists only to
      # let Codex create its nested, stricter bubblewrap sandbox.
      - seccomp:unconfined
      - apparmor:hermes-openhands-codex
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:18000/docs', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
