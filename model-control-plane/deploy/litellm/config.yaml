# LiteLLM is the single runtime authority for provider credentials, model
# deployments, health, routing and spend. Provider/model CRUD is DB-backed and is
# managed through the native LiteLLM Admin UI/API. This file intentionally contains
# no provider endpoint or provider API key.
model_list: []

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  max_fallbacks: 2
  allowed_fails: 1
  cooldown_time: 30

  # Stable development-capability names used by Hermes/OpenHands. Physical provider
  # choice and economics-aware order live entirely in LiteLLM DB deployments.
  model_group_alias:
    planning-premium: gpt-5.6-sol
    review-premium: gpt-5.6-sol
    implementation-efficient: deepseek-v4-flash

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
