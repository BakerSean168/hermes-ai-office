# LiteLLM is the single runtime authority for provider credentials, model
# deployments, health, routing and spend. Provider/model CRUD is DB-backed and is
# managed through the native LiteLLM Admin UI/API. This file intentionally contains
# no provider endpoint or provider API key.
model_list: []

router_settings:
  # Every automatic binding has its own route-<resource>-<model> group. Pixel
  # selects that exact group before launching the model-native agent, so LiteLLM
  # never changes model family or economic tier behind the durable execution.
  routing_strategy: simple-shuffle
  num_retries: 1
  allowed_fails: 1
  cooldown_time: 30

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
