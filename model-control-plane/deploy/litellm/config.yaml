# LiteLLM is the single runtime authority for provider credentials, model
# deployments, health, routing and spend. Provider/model CRUD is DB-backed and is
# managed through the native LiteLLM Admin UI/API. This file intentionally contains
# no provider endpoint or provider API key.
model_list: []

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  max_fallbacks: 2
  allowed_fails: 1
  cooldown_time: 30

  # Stable development-capability names used by Hermes/OpenHands. Physical provider
  # choice and economics-aware order live entirely in LiteLLM DB deployments.
  model_group_alias:
    planning-premium: gpt-5.6-sol
    review-premium: gpt-5.6-sol
    implementation-efficient: deepseek-v4-flash

  # Implementation may fall back within the efficient coding tier. Premium
  # planning/review intentionally has no cross-quality fallback: if every GPT
  # deployment is unhealthy, surface that condition to the Supervisor instead
  # of silently degrading a review to a cheaper model class.
  fallbacks:
    - implementation-efficient: [glm-5.2]
    - deepseek-v4-flash: [glm-5.2]

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
